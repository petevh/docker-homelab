services:
  n8n:
    build: .
    container_name: n8n
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - TZ=Asia/Dubai
      - GENERIC_TIMEZONE=Asia/Dubai
      - N8N_HOST=n8n.app.vanheerden.ch
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.app.vanheerden.ch/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_SQLITE_POOL_SIZE=3
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=1

    volumes:
      - n8n_data:/home/node/.n8n
      - ${BANK_CONFIG_FILE:-../../bank-automation/private-config.json}:/data/private-config.json:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.app.vanheerden.ch`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

    networks:
      - traefik

  # qpdf sidecar for the "Bank statements" workflow — n8n's hardened image has
  # no package manager. Internal only (no Traefik labels); n8n reaches it at
  # http://pdf-decrypt:8080. Holds the PDF passwords so they never enter n8n.
  pdf-decrypt:
    build: ./pdf-decrypt
    container_name: n8n-pdf-decrypt
    restart: unless-stopped
    # NAS share is 770 pvh:pvh — must run as that uid to read the config
    user: "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${BANK_CONFIG_FILE:-../../bank-automation/private-config.json}:/config/private-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  n8n_data:
